name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./tauri/src-tauri -> target"

      - name: Install dependencies
        run: bun install

      - name: Prepare Tauri sidecars and resources
        shell: bash
        run: |
          mkdir -p tauri/src-tauri/binaries
          mkdir -p tauri/src-tauri/gen
          touch tauri/src-tauri/gen/Assets.car
          touch tauri/src-tauri/gen/voicebox.icns

          echo "Downloading official sidecars..."
          curl -L -o setup.exe https://github.com/jamiepine/voicebox/releases/download/v0.5.0/Voicebox_0.5.0_x64-setup.exe
          7z x setup.exe -oextracted -y
          cp extracted/voicebox-server.exe tauri/src-tauri/binaries/voicebox-server-x86_64-pc-windows-msvc.exe
          cp extracted/voicebox-mcp.exe tauri/src-tauri/binaries/voicebox-mcp-x86_64-pc-windows-msvc.exe
          rm -rf setup.exe extracted

      - name: Build Tauri Desktop App
        shell: bash
        run: |
          cd tauri
          bun run tauri build --no-bundle
          bun run tauri build --bundles nsis

      - name: Upload Standalone voicebox.exe
        uses: actions/upload-artifact@v4
        with:
          name: voicebox-standalone-exe
          path: tauri/src-tauri/target/release/voicebox.exe

      - name: Upload Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: voicebox-windows-installer
          path: tauri/src-tauri/target/release/bundle/nsis/*.exe
